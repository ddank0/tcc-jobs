[project]
name = "tcc-jobs"
version = "0.1.0"
description = "ETL, features e modelos do TCC de licitações"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "polars>=1.43.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
tcc = "tcc_jobs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_jobs"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
# strict é o nível máximo do Pyright. O SQLAlchemy 2.0 tem tipagem nativa
# (PEP 484), então dispensa plugin - ao contrário do mypy.
typeCheckingMode = "strict"

# Alembic não publica type hints completos.
reportMissingTypeStubs = false
