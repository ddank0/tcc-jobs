[project]
name = "tcc-jobs"
version = "0.1.0"
description = "ETL, features e modelos do TCC de licitações"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "sqlalchemy[mypy]>=2.0.51",
]

[project.scripts]
tcc = "tcc_jobs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_jobs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

# Erros aparecem com o caminho do módulo, não só o do arquivo.
show_error_codes = true
pretty = true

# Bibliotecas sem type hints publicados. Sem isto, o strict reclama de cada
# import e o sinal útil se perde no ruído.
[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
